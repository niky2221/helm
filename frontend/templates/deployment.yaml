kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend
  namespace: expense
  # this labels are replicaset labels
  labels: 
    app: frontend
    tier: expense
    purpose: deployment
spec:
  # modify replicas according to your case
  replicas: {{ .Values.deployment.replicas }}
  selector:
    # replicaset use these labels to find the pods for creating desired number of replicas
    matchLabels:
      app: frontend
      tier: expense
      purpose: deployment
  # pod template
  template:
    metadata:
      labels:
        app: frontend
        tier: expense
        purpose: deployment
    spec:
      containers:
      - name: nginx
        image: niranjan2505/frontend:{{ .Values.frontend.image }}
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "70Mi"
            cpu: "100m"
          limits:
            memory: "120Mi"
            cpu: "140m"
        volumeMounts:
        - name: nginx
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
      volumes:
        - name: nginx
          configMap:
            name: frontend
            items:
              - key: nginx.conf
                path: nginx.conf