apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: expense
spec:
  serviceName: headless-service
  selector:
    matchLabels:
      project: expense
      app: mysql
      component: dev
  replicas: {{ .Values.statefulset.replicas }}
  minReadySeconds: 10
  template:
    metadata:
      labels:
        project: expense
        app: mysql
        component: dev
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: mysql
        image: niranjan2505/mysql1.0.0:{{ .Values.mysql.image }}
        volumeMounts:
        - name: mysql
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql
      namespace: expense
    spec: 
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
          requests:
            storage: 1Gi