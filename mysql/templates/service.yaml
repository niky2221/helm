apiVersion: v1
kind: Service
metadata:
  name: headless-service
  namespace: expense
  labels:
    project: expense
    app: mysql
    component: dev
spec:
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
  clusterIP: None
  selector:
    app: mysql
