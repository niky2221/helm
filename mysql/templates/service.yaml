apiVersion: v1
kind: Service
metadata:
  name: mysql-lb
  namespace: expense
  labels:
    project: expense
    app: mysql
    component: dev
spec:
  selector:
    project: expense
    app: mysql
    component: dev
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306