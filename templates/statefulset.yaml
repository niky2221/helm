kind: StatefulSet
apiVersion: apps/v1
metadata: 
  name: nginx
spec:
  serviceName: headless-service
  selector:
    matchLabels:
      name: statefulset
      app: nginx
  replicas: {{ .Values.statefulset.replicas }}
  minReadySeconds: 10
  template:
    metadata: 
      labels:
        name: statefulset
        app: nginx
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: registry.k8s.io/{{ .Values.statefulset.image }}
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
        requests:
          storage: 1Gi
